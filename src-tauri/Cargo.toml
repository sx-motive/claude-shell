[package]
name = "claude-shell"
version = "0.0.0"
description = "Hooks-driven desktop client around the interactive claude CLI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
which = "7"
tauri-plugin-clipboard-manager = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
